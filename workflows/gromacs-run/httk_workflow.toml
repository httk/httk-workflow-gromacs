# One GROMACS run (grompp, then mdrun) of a prepared system: a small, complete
# workflow package to copy and edit. See run.py for what the step does.
#
# It declares no outputs and has no collector, so collecting stores one
# run-only provenance record per job: httk-schemas has no MD energy property
# yet (total_energy is a DFT total energy) to declare an energy output with.

[workflow]
name = "gromacs.run"
description = "one GROMACS grompp + mdrun run of a prepared configuration, topology and run parameters"
requires = ["httk-workflow>=2.1.1", "httk-workflow-gromacs>=0.1.0"]

[workflow.runner]
entry = "run.py"
steps = ["run"]
# The persistent workdir holds the result (run.log, run.edr, ...).
data_mode = "none"

[workflow.inputs.configuration]
destination = "conf.gro"
description = "The starting configuration, a .gro file (anything gmx grompp -c reads)."
required = true

[workflow.inputs.topology]
destination = "topol.top"
description = "The system topology, a .top file."
required = true

[workflow.inputs.parameters]
destination = "run.mdp"
description = "The run parameters, an .mdp file."
required = true
